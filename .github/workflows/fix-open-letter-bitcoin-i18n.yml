  function esc(v){ return String(v == null ? '' : v); }
  function tableRows(rows){ return rows.map(r => `<tr><td class="dim">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join(''); }

  function render(lang){
    lang = COPY[lang] ? lang : 'en';
    const c = COPY[lang];

    document.querySelectorAll('.nesu-evolution').forEach(el => el.remove());
    const compare = document.getElementById('compare');
    if(compare){
      const evolution = document.createElement('div');
      evolution.className = 'wrap nesu-evolution';
      evolution.setAttribute('data-nesu-localized','true');
      evolution.innerHTML = `<span class="eyebrow">${c.evoEyebrow}</span><h2>${c.evoTitle}</h2><p class="lead">${c.evoLead}</p><div class="nesu-evolution-grid"><div class="nesu-evolution-card"><span class="eyebrow">${c.bEra}</span><h3>${c.bH}</h3><p>${c.bP}</p></div><div class="nesu-evolution-card"><span class="eyebrow">${c.brEra}</span><h3>${c.brH}</h3><p>${c.brP}</p></div><div class="nesu-evolution-card"><span class="eyebrow">${c.nEra}</span><h3>${c.nH}</h3><p>${c.nP}</p></div></div><p><strong>${c.progression}</strong> ${c.progressionText}</p><h3>${c.compareTitle}</h3><div class="table-wrap"><table class="compare" style="min-width:820px"><tr>${c.th.map(x=>`<th>${x}</th>`).join('')}</tr>${tableRows(c.rows)}</table></div><h3 style="margin-top:38px">${c.detail}</h3>`;
      compare.parentNode.insertBefore(evolution, compare);
    }

    let reg = document.getElementById('regulatory-letter');
    if(!reg){
      reg = document.createElement('section');
      reg.id = 'regulatory-letter';
      const roadmap = document.getElementById('roadmap');
      if(roadmap) roadmap.parentNode.insertBefore(reg, roadmap);
      else (document.querySelector('footer') || document.body).parentNode.insertBefore(reg, document.querySelector('footer'));
    }
    reg.innerHTML = `<div class="wrap"><span class="eyebrow">${c.openEyebrow}</span><h2>${c.openTitle}</h2><p class="lead">${c.openLead}</p><div class="reg-grid"><article class="reg-card"><h3>${c.chTitle}</h3><p>${c.chText}</p></article><article class="reg-card"><h3>${c.euTitle}</h3><p>${c.euText}</p></article><article class="reg-card"><h3>${c.dzTitle}</h3><p>${c.dzText}</p></article></div></div>`;
  }

  document.addEventListener('DOMContentLoaded', function(){
    render(document.documentElement.lang || 'en');
    const observer = new MutationObserver(function(mutations){
      if(mutations.some(m => m.type === 'attributes' && m.attributeName === 'lang')) render(document.documentElement.lang || 'en');
    });
    observer.observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  });
})();
</script>
'''

          if '</body>' not in s:
              raise SystemExit('Could not locate </body> in index.html')
          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('NESU Open Letter and Bitcoin i18n patch inserted.')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Open Letter and localize Bitcoin history"
          git push origin HEAD:fix-open-letter-bitcoin-i18n
