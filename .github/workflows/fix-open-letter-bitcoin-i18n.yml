name: Fix NESU Open Letter and Bitcoin i18n

on:
  push:
    branches:
      - fix-open-letter-bitcoin-i18n
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-open-letter-bitcoin-i18n
      - name: Patch NESU homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- NESU OPEN LETTER + BITCOIN I18N PATCH -->'
          if marker in s:
              print('Patch already present; no changes needed.')
              raise SystemExit(0)

          patch = r'''

