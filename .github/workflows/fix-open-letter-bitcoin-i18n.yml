  #regulatory-letter .reg-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
  #regulatory-letter .reg-card h3{margin-bottom:8px}
  #regulatory-letter .reg-card p{margin:0;color:var(--muted);font-size:14px}
  .nesu-evolution[data-nesu-localized="true"]{margin-top:34px}
  @media(max-width:850px){#regulatory-letter .reg-grid{grid-template-columns:1fr}}
