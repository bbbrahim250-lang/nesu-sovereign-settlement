name: Add NESU Swiss counsel briefs section
on:
  push:
    branches: [nesu-claude-sep2026-update]
    paths: ['.github/workflows/apply-nesu-homepage-updates.yml']
permissions:
  contents: write
jobs:
  swiss-counsel-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nesu-claude-sep2026-update
      - name: Add Swiss counsel briefs section
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- NESU SWISS COUNSEL BRIEFS -->'
          if marker in s:
              raise SystemExit('already applied')
          block = r'''
          <!-- NESU SWISS COUNSEL BRIEFS -->
          <style>
            #swiss-counsel{border-top:1px solid var(--line);background:var(--surface-2)}
            #swiss-counsel .counsel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
            #swiss-counsel .counsel-link{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
            #swiss-counsel .counsel-link:hover{transform:translateY(-2px);border-color:var(--gold)}
            #swiss-counsel .counsel-link strong{display:block;color:var(--navy-deep);font-family:var(--serif);font-size:1.02rem;margin-bottom:4px}
            #swiss-counsel .counsel-link span{font-size:12.5px;color:var(--muted)}
            @media(max-width:820px){#swiss-counsel .counsel-grid{grid-template-columns:1fr}}
          </style>
          <section id="swiss-counsel">
            <div class="wrap">
              <span class="eyebrow">Swiss Legal &amp; Regulatory Counsel</span>
              <h2>NESU Swiss Counsel Briefs</h2>
              <p class="lead">Multilingual briefing documents prepared for legal and regulatory review of the proposed NESU sovereign settlement architecture.</p>
              <div class="counsel-grid">
                <a class="counsel-link" href="/documents/NESU_Swiss_Counsel_Brief_EN.pdf" target="_blank" rel="noopener"><strong>English</strong><span>Open counsel brief (PDF)</span></a>
                <a class="counsel-link" href="/documents/NESU_Swiss_Counsel_Brief_FR.pdf" target="_blank" rel="noopener"><strong>Français</strong><span>Ouvrir la note juridique (PDF)</span></a>
                <a class="counsel-link" href="/documents/NESU_Swiss_Counsel_Brief_AR.pdf" target="_blank" rel="noopener" dir="rtl"><strong>العربية</strong><span>فتح المذكرة القانونية (PDF)</span></a>
                <a class="counsel-link" href="/documents/NESU_Swiss_Counsel_Brief_DE.pdf" target="_blank" rel="noopener"><strong>Deutsch</strong><span>Rechtsbrief öffnen (PDF)</span></a>
                <a class="counsel-link" href="/documents/NESU_Swiss_Counsel_Brief_ZH.pdf" target="_blank" rel="noopener"><strong>中文</strong><span>打开法律简报 (PDF)</span></a>
                <a class="counsel-link" href="/documents/NESU_Swiss_Counsel_Brief_RU.pdf" target="_blank" rel="noopener"><strong>Русский</strong><span>Открыть юридическую записку (PDF)</span></a>
              </div>
            </div>
          </section>
          '''
          if '<footer' not in s:
              raise SystemExit('footer marker not found')
          s = s.replace('<footer', block + '\n<footer', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit Swiss counsel section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add multilingual Swiss counsel briefs to NESU homepage"
          git push origin nesu-claude-sep2026-update
