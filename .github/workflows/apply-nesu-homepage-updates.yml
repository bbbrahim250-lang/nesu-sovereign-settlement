name: Repair NESU production presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-nesu-homepage-updates.yml']
permissions:
  contents: write
jobs:
  repair-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore regulators founder and compact video
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NESU PRODUCTION REPAIR SEP11 -->'
          if marker in s:
              raise SystemExit('already applied')
          old=subprocess.check_output(['git','show','0c778ad3832f65b54706098c72b8acf5e60ba5b7:index.html'],text=True)
          def section(src, sec_id):
              m=re.search(r'<section id="'+re.escape(sec_id)+r'"\b.*?</section>',src,re.S)
              if not m:
                  raise SystemExit('missing historical section '+sec_id)
              return m.group(0)
          reg=section(old,'regulatory-letter')
          founder=section(old,'founder')
          if 'id="regulatory-letter"' not in s:
              if '<section id="roadmap"' not in s:
                  raise SystemExit('roadmap anchor missing')
              s=s.replace('<section id="roadmap"',reg+'\n\n<section id="roadmap"',1)
          if '<section id="founder"' not in s:
              anchor='<section id="swiss-counsel"'
              if anchor in s:
                  s=s.replace(anchor,founder+'\n\n'+anchor,1)
              elif '<footer' in s:
                  s=s.replace('<footer',founder+'\n\n<footer',1)
              else:
                  raise SystemExit('founder insertion anchor missing')
          repair=r'''
          <!-- NESU PRODUCTION REPAIR SEP11 -->
          <style>
          #nesu-video{padding:52px 0 66px!important;overflow:visible!important;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
          #nesu-video .wrap{width:min(1040px,calc(100% - 40px))!important;max-width:1040px!important;margin:0 auto!important;padding:0 20px!important}
          #nesu-video .eyebrow,#nesu-video h2,#nesu-video .lead{padding-left:0!important;padding-right:0!important}
          #nesu-video video{display:block!important;width:min(100%,900px)!important;max-width:900px!important;height:auto!important;aspect-ratio:16/9!important;object-fit:contain!important;margin:24px auto 0!important;border-radius:16px!important;box-shadow:0 18px 50px rgba(0,0,0,.28)!important;background:#000!important}
          @media(max-width:768px){#nesu-video{padding:34px 0 44px!important}#nesu-video .wrap{width:100%!important;padding:0 18px!important}#nesu-video video{width:100%!important;max-width:100%!important;border-radius:12px!important}}
          </style>
          <script>
          document.addEventListener('DOMContentLoaded',()=>{
            const video=document.getElementById('nesu-video');
            const hero=document.querySelector('section.hero');
            if(video&&hero) hero.insertAdjacentElement('afterend',video);
            const nav=document.querySelector('nav.links, nav');
            if(nav){
              if(!nav.querySelector('a[href="#nesu-video"]')){const a=document.createElement('a');a.href='#nesu-video';a.textContent='Presentation';nav.appendChild(a)}
              if(!nav.querySelector('a[href="#regulatory-letter"]')){const a=document.createElement('a');a.href='#regulatory-letter';a.textContent='Regulators';nav.appendChild(a)}
              const f=nav.querySelector('a[href="/founder/"]');
              if(f){f.href='#founder';f.textContent='Founder'}
              else if(!nav.querySelector('a[href="#founder"]')){const a=document.createElement('a');a.href='#founder';a.textContent='Founder';nav.appendChild(a)}
            }
          });
          </script>
          '''
          s=s.replace('</body>',repair+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit repaired production page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore NESU regulators, founder photo, and compact presentation video"
          git push origin main
