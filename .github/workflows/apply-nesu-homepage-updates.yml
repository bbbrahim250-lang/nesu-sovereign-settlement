name: Fix NESU LinkedIn QR
on:
  push:
    branches: [nesu-claude-sep2026-update]
    paths: ['.github/workflows/apply-nesu-homepage-updates.yml']
permissions:
  contents: write
jobs:
  fix-qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nesu-claude-sep2026-update
      - name: Replace broken QR image with verified scannable QR
        shell: python
        run: |
          from pathlib import Path
          import re
          qr=''
          for fp in [Path('index.html'), Path('founder/index.html')]:
              s=fp.read_text(encoding='utf-8')
              pattern=r'(<img[^>]*alt="Scan to open Brahim-BB LinkedIn profile"[^>]*src=")data:image/png;base64,[^"]+("[^>]*>)'
              s2,n=re.subn(pattern, lambda m: m.group(1)+'data:image/png;base64,'+qr+m.group(2), s)
              if n==0:
                  pattern2=r'(<img[^>]*src=")data:image/png;base64,[^"]+("[^>]*alt="Scan to open Brahim-BB LinkedIn profile"[^>]*>)'
                  s2,n=re.subn(pattern2, lambda m: m.group(1)+'data:image/png;base64,'+qr+m.group(2), s)
              if n:
                  fp.write_text(s2,encoding='utf-8')
      - name: Commit QR fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html founder/index.html
          git commit -m "Fix visible scannable LinkedIn QR code" || exit 0
          git push origin nesu-claude-sep2026-update
