name: Repair NESU production presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-nesu-homepage-updates.yml']
permissions:
  contents: write
jobs:
  repair-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore regulators founder and compact video
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NESU PRODUCTION REPAIR SEP11 -->'
          if marker in s:
              raise SystemExit('already applied')

          def historical_section(sec_id):
              commits=subprocess.check_output(['git','rev-list','--all','--','index.html'],text=True).split()
              pat=re.compile(r'<section id="'+re.escape(sec_id)+r'"\b.*?</section>',re.S)
              for h in commits:
                  try:
                      old=subprocess.check_output(['git','show',f'{h}:index.html'],text=True,stderr=subprocess.DEVNULL)
                  except subprocess.CalledProcessError:
                      continue
                  m=pat.search(old)
                  if m:
                      print('restoring',sec_id,'from',h)
                      return m.group(0)
              raise SystemExit('historical section not found: '+sec_id)

          if 'id="regulatory-letter"' not in s:
              reg=historical_section('regulatory-letter')
              if '<section id="roadmap"' not in s:
                  raise SystemExit('roadmap anchor missing')
              s=s.replace('<section id="roadmap"',reg+'\n\n<section id="roadmap"',1)

          if '<section id="founder"' not in s:
              founder=historical_section('founder')
              anchor='<section id="swiss-counsel"'
              if anchor in s:
                  s=s.replace(anchor,founder+'\n\n'+anchor,1)
              elif '<footer' in s:
                  s=s.replace('<footer',founder+'\n\n<footer',1)
              else:
                  raise SystemExit('founder insertion anchor missing')

          repair=r'''
          <!-- NESU PRODUCTION REPAIR SEP11 -->
          <style>
          #nesu-video{padding:46px 0 58px!important;overflow:visible!important;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
          #nesu-video .wrap{width:min(1040px,calc(100% - 40px))!important;max-width:1040px!important;margin:0 auto!important;padding:0 20px!important}
          #nesu-video .eyebrow,#nesu-video h2,#nesu-video .lead{padding-left:0!important;padding-right:0!important}
          #nesu-video video{display:block!important;width:min(100%,820px)!important;max-width:820px!important;height:auto!important;aspect-ratio:16/9!important;object-fit:contain!important;margin:24px auto 0!important;border-radius:14px!important;border:1px solid var(--line)!important;box-shadow:0 18px 46px rgba(0,0,0,.32)!important;background:#000!important}
          @media(max-width:768px){#nesu-video{padding:32px 0 42px!important}#nesu-video .wrap{width:100%!important;padding:0 18px!important}#nesu-video video{width:100%!important;max-width:100%!important;border-radius:10px!important}}
          </style>
          <script>
          document.addEventListener('DOMContentLoaded',()=>{
            const video=document.getElementById('nesu-video');
            const hero=document.querySelector('section.hero');
            if(video&&hero) hero.insertAdjacentElement('afterend',video);
            const nav=document.querySelector('nav.links, nav');
            if(nav){
              if(!nav.querySelector('a[href="#nesu-video"]')){const a=document.createElement('a');a.href='#nesu-video';a.textContent='Presentation';nav.appendChild(a)}
              if(!nav.querySelector('a[href="#regulatory-letter"]')){const a=document.createElement('a');a.href='#regulatory-letter';a.textContent='Regulators';nav.appendChild(a)}
              const f=nav.querySelector('a[href="/founder/"]');
              if(f){f.href='#founder';f.textContent='Founder'}
              else if(!nav.querySelector('a[href="#founder"]')){const a=document.createElement('a');a.href='#founder';a.textContent='Founder';nav.appendChild(a)}
            }
          });
          </script>
          '''
          if '</body>' not in s:
              raise SystemExit('body closing tag missing')
          s=s.replace('</body>',repair+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit repaired production page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore NESU regulators, founder photo, and compact presentation video"
          git push origin main
