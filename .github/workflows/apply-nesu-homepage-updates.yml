name: Refine NESU homepage preview
on:
  push:
    branches: [nesu-claude-sep2026-update]
    paths: ['.github/workflows/apply-nesu-homepage-updates.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nesu-claude-sep2026-update
      - name: Move AI video to top and add founder profile
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NESU VIDEO TOP + FOUNDER QR -->'
          if marker in s:
              raise SystemExit('already applied')
          block=r'''
          <!-- NESU VIDEO TOP + FOUNDER QR -->
          <style>
          #nesu-video{padding:34px 0 0!important;background:var(--bg)!important;border-bottom:1px solid var(--line)!important}
          #nesu-video .wrap{max-width:none!important;width:100%!important;padding:0!important;text-align:center!important}
          #nesu-video .eyebrow,#nesu-video h2,#nesu-video .lead{display:block!important;max-width:1040px!important;margin-left:auto!important;margin-right:auto!important;padding-left:24px!important;padding-right:24px!important}
          #nesu-video video{display:block!important;width:100vw!important;max-width:none!important;height:auto!important;border-radius:0!important;box-shadow:none!important;margin:26px 0 0!important;background:#000!important}
          .nesu-founder-home{padding:72px 0;border-top:1px solid var(--line);background:var(--surface-2)}
          .nesu-founder-grid{display:grid;grid-template-columns:1fr 280px;gap:34px;align-items:center}
          .nesu-founder-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;box-shadow:var(--shadow)}
          .nesu-founder-card img{width:190px;height:190px;background:#fff;padding:10px;border-radius:14px;display:block;margin:8px auto 14px}
          .nesu-founder-card a{font-weight:700;color:var(--green);text-decoration:none}
          .nesu-founder-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
          .nesu-founder-actions a{display:inline-block;padding:11px 16px;border-radius:8px;text-decoration:none;font-weight:700;border:1px solid var(--line);background:var(--surface)}
          @media(max-width:760px){.nesu-founder-grid{grid-template-columns:1fr}.nesu-founder-card{max-width:320px;margin:auto}}
          </style>
          <script>
          document.addEventListener('DOMContentLoaded',()=>{
            const video=document.getElementById('nesu-video');
            const hero=document.querySelector('section.hero');
            if(video&&hero) hero.parentNode.insertBefore(video,hero);
            if(!document.getElementById('founder-home')){
              const footer=document.querySelector('footer');
              if(footer){
                const sec=document.createElement('section');
                sec.id='founder-home';sec.className='nesu-founder-home';
                sec.innerHTML=`<div class="wrap"><div class="nesu-founder-grid"><div><span class="eyebrow">Founder</span><h2>Brahim-BB</h2><p class="lead">Founder, NESU — Nur Energy Settlement Unit</p><p><strong>Research &amp; AI Development supported by Digital-UNI AI Labs</strong></p><p>Telecom · AI · Education · Global Development</p><p>Building bridges through technology and education, with NESU focused on research into sovereign and institutional digital settlement architecture.</p><div class="nesu-founder-actions"><a href="/founder/">Founder profile →</a><a href="https://www.linkedin.com/in/brahim-bb-600153113/" target="_blank" rel="noopener">LinkedIn profile →</a></div></div><div class="nesu-founder-card"><span class="eyebrow">Scan LinkedIn</span><img alt="Scan to open Brahim-BB LinkedIn profile" src="data:image/png;base64,"><a href="https://www.linkedin.com/in/brahim-bb-600153113/" target="_blank" rel="noopener">Brahim BB on LinkedIn →</a><p style="font-size:12px;color:var(--muted);margin:8px auto 0">Scan with a phone camera to open the verified profile.</p></div></div></div>`;
                footer.parentNode.insertBefore(sec,footer);
              }
            }
          });
          </script>
          '''
          s=s.replace('</body>',block+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit refined homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move NESU AI video to top and add founder LinkedIn QR"
          git push origin nesu-claude-sep2026-update
